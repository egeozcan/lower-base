[package]
name = "lower-base"
version = "0.1.0"
edition = "2021"
description = "A fast-paced browser RTS powered by Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[features]
dev-debug = []
# The frozen opponent and native tournament runner are excluded from web builds.
ai-bench = []

[[bin]]
name = "ai-bench"
path = "src/bin/ai-bench.rs"
required-features = ["ai-bench"]
